apiVersion: apps/v1
kind: Deployment
metadata:
  name: dclaw-building-frontend
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-building
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dclaw-building
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dclaw-building
        app.kubernetes.io/part-of: dclaw-platform
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/library/dclaw-building-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3049
              name: http
          env:
            - name: PORT
              value: "3049"
            # Server-side rewrite target for /api/* and /health/* (next.config.js).
            - name: BACKEND_URL
              value: "http://dclaw-building-backend:8143"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dclaw-building
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-building
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 3049
      targetPort: http
      nodePort: 30049
      name: http
  selector:
    app.kubernetes.io/name: dclaw-building
