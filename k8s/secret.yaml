apiVersion: v1
kind: Secret
metadata:
  name: dclaw-building-secret
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-building
    app.kubernetes.io/part-of: dclaw-platform
type: Opaque
stringData:
  # Shared cluster PostgreSQL — one database per app (see project memory:
  # never create a per-app postgres pod).
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@dclaw-shared-postgres:5432/dclaw_building"
  APP_ENV: "production"
  SECRET_KEY: "dclaw-building-local-secret-key"
