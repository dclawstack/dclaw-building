# Cloud / production overrides. Use with:
#   helm install dclaw-building ./helm -n <ns> -f values-prod.yaml

backend:
  image:
    repository: ghcr.io/dclawstack/dclaw-building-backend
    tag: latest
    pullPolicy: IfNotPresent

frontend:
  image:
    repository: ghcr.io/dclawstack/dclaw-building-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: building.dclawstack.io
  tls:
    - secretName: dclaw-building-tls
      hosts:
        - building.dclawstack.io
